<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Rickshaw Portal Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Prevent body scrolling */
        }
        #map {
            height: 100%; /* Map takes full height of its container */
            width: 100%; /* Map takes full width of its container */
            border-radius: 0.5rem; /* Rounded corners for the map container */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Subtle shadow */
        }
        .container {
            flex-grow: 1; /* Allows the container to take available space */
            padding: 1rem;
        }
    </style>
</head>
<body class="bg-gray-100">
    <header class="bg-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-800">E-Rickshaw Ride</h1>
        <nav>
            <a href="#" class="text-blue-600 hover:text-blue-800 font-medium mr-4">Home</a>
            <a href="#" class="text-blue-600 hover:text-blue-800 font-medium">Profile</a>
        </nav>
    </header>

    <main class="container flex flex-col items-center justify-center">
        <div id="map" class="w-full max-w-4xl h-96 md:h-full"></div>
    </main>

    <!-- The Google Maps API script will be loaded here -->
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAJTvXYQ7kNnhvDGmmOv97HlfeUZ31UQ1E&callback=initMap"></script>
    <script>
        // Your JavaScript for map initialization and interaction will go here
        let map; // Global variable to hold the map instance

        function initMap() {
            // Default location (e.g., center of your service area)
            const defaultLocation = { lat: 23.2599, lng: 77.4126 }; // Example: Bhopal, India

            map = new google.maps.Map(document.getElementById("map"), {
                center: defaultLocation,
                zoom: 12, // Adjust zoom level as needed
                mapTypeControl: false, // Disable map type control (roadmap, satellite)
                streetViewControl: false, // Disable street view control
                fullscreenControl: false, // Disable fullscreen control
                zoomControl: true, // Enable zoom control
                scaleControl: true, // Enable scale control
                //mapId: "YOUR_MAP_ID" // Optional: Use a Cloud-based map style ID if you have one
            });

            // Example: Add a simple marker at the default location
            new google.maps.Marker({
                position: defaultLocation,
                map: map,
                title: "Service Area Center"
            });
        }
    </script>
</body>
</html>

<html>
  <head>
    <title>Distance Matrix Service</title>
    <script>
      /**
       * @license
       * Copyright 2019 Google LLC. All Rights Reserved.
       * SPDX-License-Identifier: Apache-2.0
       */
      function initMap() {
        const bounds = new google.maps.LatLngBounds();
        const markersArray = [];
        const map = new google.maps.Map(document.getElementById("map"), {
          center: { lat: 55.53, lng: 9.4 },
          zoom: 10,
        });
        // initialize services
        const geocoder = new google.maps.Geocoder();
        const service = new google.maps.DistanceMatrixService();
        // build request
        const origin1 = { lat: 55.93, lng: -3.118 };
        const origin2 = "Greenwich, England";
        const destinationA = "Stockholm, Sweden";
        const destinationB = { lat: 50.087, lng: 14.421 };
        const request = {
          origins: [origin1, origin2],
          destinations: [destinationA, destinationB],
          travelMode: google.maps.TravelMode.DRIVING,
          unitSystem: google.maps.UnitSystem.METRIC,
          avoidHighways: false,
          avoidTolls: false,
        };

        // put request on page
        document.getElementById("request").innerText = JSON.stringify(
          request,
          null,
          2
        );
        // get distance matrix response
        service.getDistanceMatrix(request).then((response) => {
          // put response
          document.getElementById("response").innerText = JSON.stringify(
            response,
            null,
            2
          );

          // show on map
          const originList = response.originAddresses;
          const destinationList = response.destinationAddresses;

          deleteMarkers(markersArray);

          const showGeocodedAddressOnMap = (asDestination) => {
            const handler = ({ results }) => {
              map.fitBounds(bounds.extend(results[0].geometry.location));
              markersArray.push(
                new google.maps.Marker({
                  map,
                  position: results[0].geometry.location,
                  label: asDestination ? "D" : "O",
                })
              );
            };
            return handler;
          };

          for (let i = 0; i < originList.length; i++) {
            const results = response.rows[i].elements;

            geocoder
              .geocode({ address: originList[i] })
              .then(showGeocodedAddressOnMap(false));

            for (let j = 0; j < results.length; j++) {
              geocoder
                .geocode({ address: destinationList[j] })
                .then(showGeocodedAddressOnMap(true));
            }
          }
        });
      }

      function deleteMarkers(markersArray) {
        for (let i = 0; i < markersArray.length; i++) {
          markersArray[i].setMap(null);
        }

        markersArray = [];
      }

      window.initMap = initMap;
    </script>
    <style>
      /**
       * @license
       * Copyright 2019 Google LLC. All Rights Reserved.
       * SPDX-License-Identifier: Apache-2.0
       */
      /* Optional: Makes the sample page fill the window. */
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      #container {
        height: 100%;
        display: flex;
      }

      #sidebar {
        flex-basis: 15rem;
        flex-grow: 1;
        padding: 1rem;
        max-width: 30rem;
        height: 100%;
        box-sizing: border-box;
        overflow: auto;
      }

      #map {
        flex-basis: 0;
        flex-grow: 4;
        height: 100%;
      }

      #sidebar {
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="map"></div>
      <div id="sidebar">
        <h3 style="flex-grow: 0">Request</h3>
        <pre style="flex-grow: 1" id="request"></pre>
        <h3 style="flex-grow: 0">Response</h3>
        <pre style="flex-grow: 1" id="response"></pre>
      </div>
    </div>
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAJTvXYQ7kNnhvDGmmOv97HlfeUZ31UQ1E&callback=initMap&v=weekly&solution_channel=GMP_CCS_distancematrix_v2"
      defer
    ></script>
  </body>
</html>
